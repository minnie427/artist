  <noscript><main><h1>Research — Minnie Park</h1><p>Minnie Park’s ongoing research through Meta Rose examines emotional ambivalence, tactile participation and the changing life of materials. Living roses, their thorns and their gradual drying bring conflicting states into the same object. Retaining and photographing roses after exhibitions extends the inquiry into material time, memory and the limits of documentation.</p><p>Her 2025 Honours research provides a foundation: fifteen interviews and sixteen survey responses explored touch, colour and culturally situated emotional reflection in The Meta Kibun Project.</p><p><a href="../works/meta-rose/">Meta Rose</a> · <a href="../works/meta-kibun/">The Meta Kibun Project</a> · <a href="../assets/honours-exegesis.pdf">Honours Exegesis PDF</a></p></main></noscript>
